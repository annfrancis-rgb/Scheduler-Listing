  if (S.focus) { const el = document.querySelector(S.focus); if (el) el.focus(); S.focus = null; }
  protoEl.hidden = !!CH.id; // the chat page has no empty header band to sit in
  protoEl.style.left = S.drawer ? `calc((100% - min(${DRAWER_W}px, 100%)) / 2)` : '50%';
}

function openDrawer(id, tab, focusRunId) {
  if (CH.id) closeChat();
  const s = SX(id);
  if (S.drawer && S.drawer.id !== id) { dhost.innerHTML = ''; DS.id = null; DS.ed = null; }
  S.drawer = { id, tab: tab || 'overview' }; S.shown = 10; S.open = {}; S.tech = {}; S.allRec = {};
  const first = focusRunId ? s.runs.find(r => r.id === focusRunId) : s.runs[0];
  if (first && (focusRunId || first.result !== 'sent')) S.open[first.id] = true;
  S.focus = '#sdrawer';
}
function closeDrawer() { S.drawer = null; }

function runNow(s) {
  const r = mkRun(new Date(NOW.getTime() + (s.runs.length % 7) * 60000), s.to, { result:'sending', by:ME });
  s.runs.unshift(r);
  setTimeout(() => {
    r.notFound = s.bad.filter(e => s.to.includes(e));
    r.result = r.notFound.length ? 'partial' : 'sent';
    if (S.drawer && S.drawer.id === s.id && r.result !== 'sent') S.open[r.id] = true;
    render();
  }, 3000);
  return r;
}

function deploy() {
  const ed = curEd(), s = SX(curId()), st = ed.state(), next = ed.next();
  ['repeats','dailyMode','weekDays','monthDays','time','tz','cron','startMode','start','endMode','end']
    .forEach(k => s.cfg[k] = st[k]);
  s.to = st.recipients.slice();
  s.sched = ed.summary().replace(/ IST$/, '');
  if (s.status === 'live') s.next = next;
  else if (s.status === 'paused') s.resume = next;
  else if (s.status === 'ended' && next) { s.status = 'live'; s.next = next; }
  ed.deploy(); s.ver += 1;
  toast(s.status === 'paused' ? 'Deployed. It stays paused until you resume it'
    : next ? 'Deployed. Next run ' + at(next) : 'Deployed');
}

function act(k) {
  const [h, a, b] = k.split(':');
  if (h !== 'more' && h !== 'dd' && h !== 'dmore') S.menu = null;
  if (h === 'noop') return;
  if (h === 'open')  { openDrawer(a, 'overview'); }
  if (h === 'more')  { S.menu = S.menu === a ? null : a; }
  if (h === 'dd')    { S.menu = S.menu === '__' + a ? null : '__' + a; }
  if (h === 'set')   { S[a] = b; S.menu = null; }
  if (h === 'sort')  { S.sort = S.sort === 'asc' ? 'desc' : 'asc'; }
  if (h === 'new')   { toast('Opens a new chat, where you describe the report and aiRA sets up the schedule', 'info'); }
  if (h === 'tab')   { S.drawer.tab = a; }
  if (h === 'dmore') { S.menu = S.menu === '__drawer' ? null : '__drawer'; }
  if (h === 'dclose' || h === 'scrim') {
    if (dirtyEd()) S.modal = { kind:'discard', id:S.drawer.id }; else closeDrawer();
  }
  if (h === 'deploy') { deploy(); }
  if (h === 'chclose') { if (dirtyEd()) S.modal = { kind:'discard', id:CH.id }; else closeChat(); }
  if (h === 'run')   { S.open[a] = !S.open[a]; }
  if (h === 'tech')  { S.tech[a] = !S.tech[a]; }
  if (h === 'allrec'){ S.allRec[a] = !S.allRec[a]; }
  if (h === 'older') { S.shown += 10; }
  if (h === 'toastclose') { S.toast = null; }
  if (h === 'view')  { S.toast = null; openDrawer(a, 'runs', b); }
  if (h === 'mi') {
    if (a === 'runs')    openDrawer(b, 'runs');
    if (a === 'edit')    openDrawer(b, 'overview');
    if (a === 'editrec') { S.drawer.tab = 'overview'; render(); DS.ed.openSection('recipients');
      document.getElementById('blk-recipients').scrollIntoView({ block:'start' }); return; }
    if (a === 'share')   openShare(SX(b));
    if (['runnow','pause','resume','archive','restore'].includes(a)) S.modal = { kind:a, id:b };
  }
  if (h === 'mcancel') { S.modal = null; }
  if (h === 'mconfirm' && S.modal) {
    const { kind, id } = S.modal, s = SX(id);
    S.modal = null;
    if (kind === 'discard') { if (CH.id) closeChat(); else closeDrawer(); }
    if (kind === 'runnow') { const r = runNow(s);
      if (S.drawer && S.drawer.id === id) { S.drawer.tab = 'runs'; S.open = { [r.id]: true }; toast('Sending now'); }
      else toast('Sending “' + s.name + '” now', 'success', ['View run', 'view:' + id + ':' + r.id]); }
    if (kind === 'pause')   { s.resume = s.next; s.next = null; s.status = 'paused'; toast('Paused. Nothing goes out until you resume it'); }
    if (kind === 'resume')  { s.next = s.resume; s.status = 'live'; toast('Resumed. Next run ' + at(s.next)); }
    if (kind === 'archive') { s.resume = s.next || s.resume; s.next = null; s.prev = s.status; s.status = 'archived'; closeDrawer(); toast('Archived'); }
    if (kind === 'restore') { s.status = 'paused'; toast('Restored as paused. Resume it when you’re ready');
      if (S.drawer) { const t = S.drawer.tab; dhost.innerHTML = ''; DS.id = null; DS.ed = null; S.drawer = { id, tab:t }; } }
  }
  render();
}

function onClick(e) {
  const el = e.target.closest('[data-fk]');
  if (!el) { if (S.menu) { S.menu = null; render(); } return; }
  const k = el.getAttribute('data-fk');
  if (k === 'scrim' && e.target !== el) return;
  e.stopPropagation();
  act(k);
}
appEl.addEventListener('click', onClick);
dhost.addEventListener('click', onClick);
chathost.addEventListener('click', onClick);
appEl.addEventListener('input', e => {
  if (e.target.id === 'qbox') { S.q = e.target.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  // The panel's own fields (menus, calendar, full-email preview) handle their own Escape.
  if (e.target.closest && e.target.closest('#sched-ed')) return;
  if (SHARE.isOpen()) { SHARE.close(); return; }
  if (CH.id && !S.modal) return act('chclose');
  if (document.querySelector('#sched-ed .pv-modal')) return;
  if (S.menu) S.menu = null; else if (S.modal) S.modal = null; else if (S.drawer) return act('dclose'); else return;
  render();
});

protoEl.innerHTML = `<span class="plabel">Prototype</span><button type="button" id="preset">Reset</button>`;
document.getElementById('preset').onclick = () => {
  SCH = seed(); Object.assign(S, { status:'all', owner:'any', q:'', sort:'asc', menu:null, drawer:null,
    open:{}, tech:{}, allRec:{}, shown:10, modal:null, toast:null });
  render();
};
render();
</script>
