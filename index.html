<style>
/* ── aiRA Design System v1.1, foundations.md values. Three stand-ins for tokens
      the published table does not print: --aira-bg-danger, --aira-bg-scrim and
      --avatar-grad. ─────────────────────────────────────────────────────────── */
.aira{
  --aira-bg-default:#FFFFFF; --aira-bg-subtle:#FBFCFD; --aira-bg-muted:#EEF1F4;
  --aira-bg-canvas:#F6F8FA; --aira-bg-elevated:#FFFFFF; --aira-bg-surface:#FFFFFF;
  --aira-bg-sunken:#EEF1F4;
  --aira-bg-inverse:#111827; --aira-bg-selected:#EEF0FF; --aira-bg-hover:#EEF1F4;
  --aira-bg-brand:#3438C9; --aira-bg-brand-hover:#252AA0;
  --aira-text-primary:#111827; --aira-text-secondary:#364152; --aira-text-tertiary:#6B7785;
  /* Placeholder text has its own token — the same value as disabled, two steps
     lighter than tertiary, which is what it had been wrongly painted with. */
  --aira-text-placeholder:#9AA4B2;
  --aira-text-link:#3438C9; --aira-text-inverse:#FFFFFF; --aira-text-disabled:#9AA4B2;
  --aira-text-danger:#D92D2D; --aira-text-success:#1F7A42; --aira-text-warning:#B97300;
  --aira-border-subtle:#EEF1F4; --aira-border-default:#E2E6EB; --aira-border-strong:#C9D0D9;
  --aira-border-brand:#3438C9; --aira-border-focus:#3438C9;
  --aira-radius-xs:4px; --aira-radius-sm:6px; --aira-radius-md:8px; --aira-radius-lg:12px;
  --aira-radius-xl:16px; --aira-radius-2xl:20px; --aira-radius-pill:999px;
  --aira-radius-circle:50%;
  --aira-shadow-sm:0 1px 3px rgba(17,24,39,.08);
  --aira-shadow-md:0 4px 12px rgba(17,24,39,.10);
  --aira-shadow-lg:0 8px 24px rgba(17,24,39,.16);
  --aira-motion-fast:120ms; --aira-motion-base:200ms; --aira-motion-slow:320ms;
  /* White on --aira-bg-danger measures 4.81:1, which clears AA for the
     destructive modal's primary. Status surfaces are painted on licensed
     neutrals rather than on invented amber and red tints. */
  --aira-bg-danger:#D92D2D;
  /* Status surfaces, verbatim from the published token set. */
  --aira-status-warning-bg:#FFF6E0; --aira-status-warning-text:#8A5500;
  --aira-status-danger-bg:#FFECEC;  --aira-status-danger-text:#B11E1E;
  --aira-bg-scrim:rgba(17,24,39,0.45);
  --aira-brand-from:#6268FF; --aira-brand-to:#3BA7FF;
  --aira-avatar-grad:linear-gradient(135deg,var(--aira-brand-from),var(--aira-brand-to));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
/* Single-theme on purpose: this has to be indistinguishable from the real aiRA
   product, which renders light. Every colour is painted explicitly so the page
   holds its own ground whatever theme the viewer is in. */
body{font:400 14px/20px Roboto,system-ui,sans-serif;background:var(--aira-bg-canvas);
  color:var(--aira-text-primary);overflow:hidden}
button,input,textarea{font-family:inherit}
/* position:relative so the drawer scrim, the modal scrim and the toast all
   resolve against the app box rather than the viewport — at 200% zoom the
   viewport is narrower than the app, and a viewport-sized scrim leaves part of
   the listing bright and undimmed beside an open dialog. */
#app{width:100%;height:100%;display:flex;min-width:1180px;position:relative}
/* Below the product's own minimum the window scrolls rather than clipping the
   screen away. This is a desktop settings surface; it does not reflow to a phone. */
@media (max-width:1180px){ body{overflow-x:auto} }

/* outline, never a box-shadow ring — a shadow ring merges into a card's own shadow. */
.aira [data-fk]:focus-visible{outline:2px solid var(--aira-border-focus);outline-offset:2px;
  border-radius:var(--aira-radius-xs)}
/* The bordered wrapper IS the field; the input is the text inside it, so the ring
   goes round the whole control rather than round the caret's box. */
.aira .qwrap:focus-within{outline:2px solid var(--aira-border-focus);outline-offset:2px}
.aira .qbox:focus-visible,.aira .tbox:focus-visible{outline:none}
.qbox::placeholder,.tbox::placeholder{color:var(--aira-text-placeholder);opacity:1}
.aira .tbox{resize:vertical}

/* Thumb only, no track — the aiRA scrollbar treatment. */
.scroller::-webkit-scrollbar{width:6px;height:6px}
.scroller::-webkit-scrollbar-track{background:transparent}
.scroller::-webkit-scrollbar-thumb{background:var(--aira-border-strong);
  border-radius:var(--aira-radius-pill)}

.reset{all:unset;box-sizing:border-box;display:block;cursor:pointer}
.reset[disabled]{cursor:default}

/* In an open menu, hover wins: the selected row drops its fill the moment the
   pointer is in the list, so only one row is ever grey. The tick keeps saying
   which one is selected, because colour is never the only signal. */
.aira .mitem{transition:background var(--aira-motion-fast) ease-out}
.aira .mitem:hover{background:var(--aira-bg-hover)}
.aira .mitem.sel{background:var(--aira-bg-hover)}
.aira .menu:hover .mitem.sel{background:transparent}
.aira .menu:hover .mitem:hover{background:var(--aira-bg-hover)}
.aira .mitem[disabled]{color:var(--aira-text-disabled)}
.aira .mitem[disabled]:hover{background:transparent}

/* Hover lives in CSS: an inline style has no state. Each rule sits after .reset
   so it outranks the `all:unset` that would otherwise clear the background. */
.aira .hov{transition:background var(--aira-motion-fast) ease-out}
.aira .hov:hover{background:var(--aira-bg-hover)}
.aira .hov[disabled]:hover{background:transparent}
/* Hover belongs to the row, not to the name — this is the app listing page's
   behaviour copied exactly: class "hov" on the whole row, cursor:pointer, and
   a plain name with no colour change and no underline of its own.
   --aira-text-tertiary measures 4.02:1 on --aira-bg-hover, under the 4.5:1 AA
   floor, so quiet text steps up to secondary (9.1:1) for as long as the row is
   hovered. Nothing else in the row is tertiary. */
.aira .hov:hover .quiet{color:var(--aira-text-secondary)}
.aira .dplink:hover{text-decoration:underline}

/* AiraTooltip. A `title` attribute fires on hover and never on keyboard focus,
   which is the one case that matters here: the name is the row's affordance and
   it is the thing being truncated. */
.aira [data-tip]::after{content:attr(data-tip);position:absolute;left:0;top:100%;
  margin-top:4px;z-index:6;white-space:nowrap;pointer-events:none;opacity:0;
  transition:opacity var(--aira-motion-fast) ease-out;
  font:400 13px/20px Roboto,system-ui,sans-serif;color:var(--aira-text-inverse);
  background:var(--aira-bg-inverse);border-radius:var(--aira-radius-sm);
  padding:4px 8px;box-shadow:var(--aira-shadow-md)}
.aira [data-tip]:hover::after,.aira [data-tip]:focus-visible::after{opacity:1}
@media (prefers-reduced-motion:reduce){ .aira [data-tip]::after{transition:none} }

/* Under reduced motion animation halts, it does not accelerate. */
@media (prefers-reduced-motion:reduce){
  .aira .hov,.aira .mitem{transition:none}
  .aira .spin{animation:none}
}
.aira .spin{animation:sp 800ms linear infinite;transform-origin:50% 50%}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── prototype controls ──────────────────────────────────────────────────────
   Plainly not part of the product: one strip in the shell's own neutral rather
   than an aiRA token, so nobody can mistake it for a feature. Centred on the top
   edge, in the empty middle of the org header — the only band of the window that
   holds nothing at any width, and clear of the drawer's footer buttons. */
#proto{position:fixed;left:50%;transform:translateX(-50%);top:7px;z-index:40;
  display:flex;flex-wrap:nowrap;align-items:center;max-width:calc(100vw - 32px);
  gap:6px;padding:6px 10px;border-radius:999px;background:rgba(17,24,39,.94);
  box-shadow:0 8px 24px rgba(17,24,39,.24)}
#proto .plabel{font:600 11px/16px Roboto,system-ui,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:#9AA4B2;padding:0 4px;flex:none}
#proto .pnote{font:400 12px/16px Roboto,system-ui,sans-serif;color:#8B95A5;
  padding:0 6px;flex:none;white-space:nowrap}
#proto button{all:unset;box-sizing:border-box;cursor:pointer;white-space:nowrap;
  font:400 13px/20px Roboto,system-ui,sans-serif;color:#C8CFDB;
  padding:5px 10px;border-radius:999px;transition:background 120ms ease-out}
#proto button:hover{background:rgba(255,255,255,.10);color:#F4F6FA}
#proto button[aria-pressed="true"]{background:#F4F6FA;color:#111827}
#proto button:focus-visible{outline:2px solid #8E97FF;outline-offset:2px}
#proto .psep{width:1px;height:20px;flex:none;background:rgba(255,255,255,.16);margin:0 2px}
@media (prefers-reduced-motion:reduce){ #proto button{transition:none} }
</style>
<style>
.aira .dplink:hover{text-decoration:underline}
.aira{ --aira-approval-draft-bg:#EEF1F4; --aira-approval-draft-text:#364152;
  --aira-approval-awaiting-bg:#FFF6E0; --aira-approval-awaiting-text:#8A5500;

#dhost{position:fixed;inset:0;z-index:6}
#chathost{position:fixed;inset:0;z-index:7;background:#F6F8FA}
#proto[hidden],#chathost[hidden],#dhost[hidden]{display:none}
</style>
<div id="app" class="aira"></div><div id="dhost" class="aira" hidden></div><div id="chathost" class="aira" hidden></div><div id="share-host"></div><div id="proto"></div>

#sched-ed *{ box-sizing: border-box; }

#sched-ed button, #sched-ed input{ font: inherit; color: inherit; }

#sched-ed .panel{
  max-width: 640px; margin-inline: auto; background: var(--aira-bg-surface);
  border: 1px solid var(--aira-border-default); border-radius: var(--aira-radius-lg); box-shadow: var(--aira-shadow-sm);
}

  const $ = (s, r = document) => r.querySelector(s);

    { id: 'Europe/London', abbr: 'UK time', label: 'UK time', sub: 'Europe/London' },

  /* ---------- the rule, as a function of a day plus a list of times ---------- */

  /* ---------- rendering ---------- */

  }
  function toCron() {

  }

  // Names the next month that lacks the picked day, e.g. "No 31st in November, so it runs on Mon 30 Nov instead."
  function shortMonthNote(day) {
    const now = nowWall(S.tz);

      const y = now.getUTCFullYear(), m = now.getUTCMonth() + i;

    const n = S.repeats === 'custom' ? 3 : 1;
    const relDay = r => { const x = rel(r, now); return ['Today', 'Tomorrow'].includes(x) ? x : fmtDate(r); };
    const runsTxt = next.slice(0, n).map(r => `${relDay(r)}, ${fmtTime(r)}`).join(' · ');

    if (days === 0) return 'Today';
    if (days === 1) return 'Tomorrow';
    if (days < 7) return `In ${days} days`;
    if (days < 14) return 'Next week';
    return `In ${Math.round(days / 7)} weeks`;
  }

  function openCal(kind) {
    closeMenus(); closeCal();
    const btn = $(`#${kind}-date`); if (!btn) return;
    const isStart = kind === 'starts';
    const today = startOfDay(nowWall(S.tz));
    const rule = buildRule();
    let minDay = today;
    if (!isStart && !rule.error) { const f = runs(rule, effectiveFrom(), null, 1)[0]; if (f) minDay = startOfDay(f); }
    const selKey = isStart ? S.start : S.end;
    const sel = selKey ? fromKey(selKey) : null;
    let view = sel || minDay;
    let focusDay = sel && sel >= minDay ? sel : minDay;
    const el = document.createElement('div');
    el.className = 'cal'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', isStart ? 'Choose a start date' : 'Choose an end date');
    btn.parentElement.appendChild(el); btn.setAttribute('aria-expanded', 'true');
    cal = { el, kind };

    const draw = () => {
      const y = view.getUTCFullYear(), m = view.getUTCMonth();
      const first = W(y, m, 1), lead = monIdx(first), n = lastDom(y, m);
      const from = isStart ? nowWall(S.tz) : effectiveFrom();
      const runDays = rule.error ? new Set() : new Set(runs(rule, from < first ? first : from, W(y, m, n, 23, 59), 400).map(dayKey));
      const rStart = S.startMode === 'date' && S.start ? fromKey(S.start) : null;
      const rEnd = S.endMode === 'date' && S.end ? fromKey(S.end) : null;
      const prevOk = W(y, m, 1) > W(minDay.getUTCFullYear(), minDay.getUTCMonth(), 1);
      let cells = '';
      for (let i = 0; i < lead; i++) cells += `<span class="cal-day out" aria-hidden="true"></span>`;
      for (let d = 1; d <= n; d++) {
        const day = W(y, m, d), k = dayKey(day);
        const dis = day < minDay;
        const isSel = sel && k === dayKey(sel);
        const inRange = rStart && rEnd && day > rStart && day < rEnd;
        const runs_ = runDays.has(k);
        const cls = ['cal-day', isSel ? 'sel' : '', k === dayKey(today) ? 'today' : '', inRange ? 'range' : ''].join(' ');
        cells += `<button type="button" class="${cls}" data-k="${k}" ${dis ? 'disabled' : ''} tabindex="${k === dayKey(focusDay) ? 0 : -1}" aria-label="${fmtDate(day)}${runs_ ? ', runs' : ''}${k === dayKey(today) ? ', today' : ''}" ${isSel ? 'aria-pressed="true"' : ''}>${d}${runs_ ? '<span class="dot"></span>' : ''}</button>`;
      }
      el.innerHTML = `<div class="cal-head"><strong>${MON_FULL[m]} ${y}</strong><span class="nav">
          <button type="button" class="icon-btn" data-nav="-1" aria-label="Previous month" ${prevOk ? '' : 'disabled'}>${icon('chev-left')}</button>

        <div class="cal-foot"><span class="legend"><i></i>Days it runs</span></div>`;
      el.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { view = W(y, m + +b.dataset.nav, 1); draw(); });
      el.querySelectorAll('.cal-day[data-k]').forEach(b => {
        b.onclick = () => pick(b.dataset.k);
        b.onkeydown = e => {
          const step = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
          if (!step) return; e.preventDefault();
          const nd = addDays(fromKey(b.dataset.k), step);
          if (nd < minDay) return;
          focusDay = nd;
          if (nd.getUTCMonth() !== m) { view = W(nd.getUTCFullYear(), nd.getUTCMonth(), 1); draw(); }
          else draw();
          const t = el.querySelector(`[data-k="${dayKey(nd)}"]`); if (t) t.focus();

      });
    };
    const pick = k => {
      if (isStart) { S.start = k; S.startMode = 'date'; if (S.end && fromKey(S.end) < fromKey(k)) { S.end = null; S.endMode = 'never'; } } else { S.end = k; S.endMode = 'date'; }
      closeCal(); render(); const b = $(`#${kind}-date`); if (b) b.focus();
    };
    el.onkeydown = e => { if (e.key === 'Escape') { closeCal(); btn.focus(); } };
    draw();
    const f = el.querySelector('.cal-day[tabindex="0"]'); if (f) f.focus();

    const stores = [['Bengaluru Indiranagar', '2,14,800', '112'], ['Chennai Anna Nagar', '1,96,350', '104'], ['Mumbai Bandra West', '1,88,900', '97'], ['Pune Koregaon Park', '1,52,400', '81']];
    const channels = [['Online', '6,42,000', '352', '39.9%'], ['Store', '4,98,000', '271', '30.9%'], ['App', '3,12,000', '165', '19.4%'], ['Marketplace', '1,57,400', '85', '9.8%']];
    return `<div class="mail-body">
          <header class="m-sec"><h3 class="m-title">${esc(init.name)}</h3><p class="lede">Mon 12 Oct 2026 across 128 stores. The numbers are sample data.</p></header>
          <section class="m-sec">
            <div class="m-kpis">
              <div class="m-kpi"><span>REVENUE (YESTERDAY)</span><strong>₹16.09 L</strong></div>
              <div class="m-kpi"><span>VS SAME DAY LAST WEEK</span><strong class="up">▲ +5.5%</strong></div>
              <div class="m-kpi"><span>TRANSACTIONS</span><strong>873</strong></div>
              <div class="m-kpi"><span>AVG TRANSACTION VALUE</span><strong>₹1,842</strong></div>
            </div>
          </section>
          <section class="m-sec">
            <h4>Revenue trend</h4>
            <p class="m-sub">Daily revenue, last 7 days (6–12 Oct 2026)</p>
            ${trendChart()}
            <p class="m-trust">Source: transactions · Sample data as of Tue 13 Oct 2026, 9:00 AM IST</p>
          </section>
          <section class="m-sec">
            <h4>Channel breakdown</h4>
            <div class="m-tablewrap"><table class="m-table">
              <thead><tr><th>Channel</th><th class="num">Revenue (₹)</th><th class="num">Transactions</th><th class="num">Share</th></tr></thead>
              <tbody>${channels.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td><td class="num">${r[3]}</td></tr>`).join('')}</tbody>
            </table></div>
          </section>
          <section class="m-sec">
            <h4>Top stores</h4>
            <div class="m-tablewrap"><table class="m-table">
              <thead><tr><th>Store</th><th class="num">Revenue (₹)</th><th class="num">Transactions</th></tr></thead>
              <tbody>${stores.map(r => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="num">${r[2]}</td></tr>`).join('')}</tbody>
            </table></div>
          </section>
          <footer class="m-foot">You get this email because you're on the ${esc(init.name)} schedule.</footer>
        </div>`;
  }
  function renderPreview() {
    const body = $('#body-preview');
    body.innerHTML = `<div class="pv-rows">
        <div class="pv-label" id="lbl-subj">Subject</div>
        ${subjEdit ? `<div class="pv-subj-edit">
            <div class="inline subj-line"><label class="control subj-input ${subjErr ? 'invalid' : ''}"><input id="subj" value="${esc(subjDraft)}" aria-labelledby="lbl-subj" aria-describedby="subj-hint" maxlength="150" autocomplete="off"></label>
            <button type="button" class="btn tertiary" id="subj-done">Done</button></div>
            ${subjErr ? `<p class="err" id="subj-hint">${icon('alert')}Add a subject.</p>` : ''}
          </div>`
        : `<div class="pv-subject"><span>${subjectLine()}</span>${init.inChat ? `<button type="button" class="icon-btn" id="subj-edit" aria-label="Edit subject">${icon('pencil')}</button>` : ''}</div>`}
        <div class="pv-label">Message body</div>
        <div class="pv-card" id="pv-card" role="button" tabindex="0" aria-label="Open the full email">
          <div class="pv-clip" aria-hidden="true"><article class="pv-mail">${mailBody()}</article></div>
          <div class="pv-open"><span class="pv-open-link">Open full email ${icon('expand')}</span></div>
        </div>
        ${init.inChat ? '' : `<div class="pv-label"></div>
        <p class="pv-chat"><span class="hint">Want to change the subject or the report?</span> <button type="button" class="link" id="pv-chat">Edit in chat</button></p>`}
      </div>`;
    const card = $('#pv-card');
    card.onclick = () => openPreview('desktop', card);
    card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPreview('desktop', card); } };
    if ($('#pv-chat')) $('#pv-chat').onclick = () => onChat && onChat();
    const se = $('#subj-edit');
    if (se) se.onclick = () => { subjEdit = true; subjDraft = S.subject; subjErr = false; renderPreview(); const i = $('#subj'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); };
    const si = $('#subj');
    if (si) {
      const save = () => { const v = si.value.trim(); if (!v) { subjErr = true; subjDraft = ''; renderPreview(); $('#subj').focus(); return; } S.subject = v; subjEdit = false; render(); $('#subj-edit').focus(); };
      si.oninput = () => { subjDraft = si.value; };
      si.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); save(); } else if (e.key === 'Escape') { subjEdit = false; renderPreview(); $('#subj-edit').focus(); } };
      $('#subj-done').onclick = save;
    }
  }

  /* Full-screen preview, the same one used for creatives elsewhere in aiRA */
  let pvReturn = null;
  function openPreview(mode, from) {
    pvReturn = from;
    const m = document.createElement('div');
    m.className = 'pv-modal'; m.setAttribute('role', 'dialog'); m.setAttribute('aria-modal', 'true'); m.setAttribute('aria-label', 'Email preview');
    const tabs = [['desktop', 'monitor', 'Desktop'], ['mobile', 'phone', 'Mobile'], ['html', 'code', 'HTML'], ['client', 'eye', 'Client']];
    const draw = () => {
      const stage = mode === 'html'
        ? `<pre class="pv-code"><code>${esc(mailBody().replace(/\n\s+/g, '\n'))}</code></pre>`
        : mode === 'client'
          ? `<article class="pv-mail client"><dl class="env"><dt>From</dt><dd>aiRA reports</dd><dt>To</dt><dd>${S.recipients.length} ${S.recipients.length === 1 ? 'person' : 'people'}</dd><dt>Subject</dt><dd class="subj">${subjectLine()}</dd></dl>${mailBody()}</article>`
          : `<article class="pv-mail ${mode}">${mailBody()}</article>`;
      m.innerHTML = `<div class="pv-sheet">
          <header class="pv-mhead">
            <p class="pv-msubj"><strong>Subject:</strong> ${subjectLine()}</p>
            <div class="pv-tabs" role="tablist" aria-label="Preview mode">${tabs.map(([k, ic, l]) => `<button type="button" role="tab" aria-selected="${mode === k}" tabindex="${mode === k ? 0 : -1}" data-t="${k}">${icon(ic)}${l}</button>`).join('')}</div>
            <span class="pv-div" aria-hidden="true"></span>
            <button type="button" class="icon-btn" id="pv-close" aria-label="Close preview">${icon('x')}</button>
          </header>
          <div class="pv-mbody">${stage}</div>
          <footer class="pv-mfoot"><button type="button" class="btn secondary" id="pv-done">Done</button></footer>
        </div>`;
      m.querySelectorAll('[data-t]').forEach((t, i, all) => {
        t.onclick = () => { mode = t.dataset.t; draw(); m.querySelector(`[data-t="${mode}"]`).focus(); };
        t.onkeydown = e => { const k = { ArrowRight: 1, ArrowLeft: -1 }[e.key]; if (!k) return; e.preventDefault(); all[(i + k + all.length) % all.length].click(); };
      });
      m.querySelector('#pv-close').onclick = close; m.querySelector('#pv-done').onclick = close;
    };
    const close = () => { m.remove(); if (pvReturn) pvReturn.focus(); };
    m.onkeydown = e => { if (e.key === 'Escape') close(); };
    m.onclick = e => { if (e.target === m) close(); };
    draw(); $('#sched-ed').appendChild(m);
    m.querySelector(`[data-t="${mode}"]`).focus();
  }

  function render() {
    closeMenus();
    const rule = buildRule();
    renderRepeats(); renderOn(rule); renderAt(rule);
    renderDateRow('starts', rule); renderDateRow('ends', rule);
    renderReadback(rule); renderRecipients(); syncHeader(); renderBlocks();
  }
    render();
  const changed = () => ['repeats','dailyMode','weekDays','monthDays','time','tz','cron','startMode','start','endMode','end','recipients']
    .some(k => JSON.stringify(S[k]) !== JSON.stringify(deployed[k]));
  return {
    state: () => JSON.parse(JSON.stringify(S)),
    changed,
    valid: () => { const r = buildRule(); return !r.error && !readbackProblem && S.recipients.length > 0 && !S.recipients.some(e => !validEmail(e)); },
    summary: () => { const r = buildRule(); return r.error ? '' : describe(r); },
    openSection: k => { if (!open[k]) { snap[k] = sectionState(k); open[k] = true; render(); } },
    deploy: () => { deployed = JSON.parse(JSON.stringify(S)); version += 1; Object.keys(open).forEach(k => { if (k !== 'preview') open[k] = false; }); render(); },
    next: () => { const r = buildRule(); if (r.error) return null; const n = runs(r, effectiveFrom(), untilOf(), 1)[0];
      return n ? new Date(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate(), n.getUTCHours(), n.getUTCMinutes()) : null; },
  };
}

  };

  var ROLE_SUB = {
    editor: 'Can edit the schedule',
    viewer: 'Can view the schedule'
  };

  // What the chosen role is allowed to do. The owner tunes this per batch in
  // the compose step; fixed rows are stated but not editable.
  var CAPS = {
    editor: [
      { id: 'edit', label: 'Edit and deploy new versions' },
      { id: 'share', label: 'Share and change permissions' }
    ],
    viewer: []
  };

  var ORG = 'Trendly India';
  var ORG_DOMAIN = 'capillarytech.com';

  // The organization directory the picker searches.
  var DIRECTORY = [
    { id: 'punya', name: 'Punya Shetty', email: 'punya.shetty@capillarytech.com' },
    { id: 'rakshit', name: 'Rakshit Naik', email: 'rakshit.naik@capillarytech.com' },
    { id: 'tara', name: 'Tara Menon', email: 'tara.menon@capillarytech.com' },
    { id: 'sara', name: 'Sara Iyer', email: 'sara.iyer@capillarytech.com' },
    { id: 'saran', name: 'Saran Kumar', email: 'saran.kumar@capillarytech.com' },
    { id: 'mehul', name: 'Mehul Goel', email: 'mehul.goel@capillarytech.com' },
    { id: 'pavan', name: 'Pavan J', email: 'pavan.j@capillarytech.com' },
    { id: 'dev', name: 'Dev Kumar', email: 'dev.kumar@capillarytech.com' },
    { id: 'sana', name: 'Sana Iqbal', email: 'sana.iqbal@capillarytech.com' }
  ];

  function allCaps() { return { edit: true, rename: true, share: true }; }

  function person(id, name, email, role, caps) {
    return { id: id, name: name, email: email, role: role, caps: caps || allCaps() };
  }
  function baseline() {
    return [person('owner', OWNER ? OWNER.name : 'Ann Francis', OWNER ? OWNER.email : 'ann.francis@capillarytech.com', 'owner')];
  }

  function existingEditor() {
    return person('test12', 'test_user12', 'test_user12@gmail.com', 'editor');
  }

  // ---------------------------------------------------------------
  // One state object.
  // ---------------------------------------------------------------
  var S = {
    open: true,
    view: 'picker',             // picker | compose | settings
    settingsFrom: 'picker',     // where the gear was opened from, so Back returns there
    canEditorsShare: true,      // app-wide: editors may share & change permissions
    people: baseline(),
    batchRole: 'viewer',        // the role this batch of recipients lands on
    batchRoleMenuOpen: false,
    caps: { edit: true, rename: true, share: true },
    manageFor: null,
    notify: true,
    message: '',
    peopleError: false,
    draft: '',
    caret: 0,
    inputFocused: false,
    results: 'closed',          // closed | loading | list | none | invalid
    suggestions: [],
    chips: [],
    roleMenuFor: null,
    accessMenuOpen: false,
    access: 'restricted',       // restricted | org
    orgRole: 'viewer',          // the role everyone in the org gets
    orgRoleMenuOpen: false,
    busy: false,
    banner: null,
    toast: null,
    copied: false,
    undo: null,                 // the last removal, restorable from the toast
    shared: false,          // a share has completed, so the primary becomes Done
    listScrollTop: 0,
    me: 'owner',
    failNext: false,
    partialNext: false,
    confirmOwner: null,         // id of the person a transfer is being confirmed for
    mode: 'share',             // share | email  (reviewer's view toggle)
    emailType: 'editor'        // which email variant the email view previews
  };

  var timers = { load: null, share: null, copy: null, toast: null };
  function clearTimers() {
    Object.keys(timers).forEach(function (k) {
      if (timers[k]) { clearTimeout(timers[k]); timers[k] = null; }
    });
  }

  // Derived &mdash; computed, never stored.
  function hasAccess(id) {
    return S.people.some(function (p) { return p.id === id; });
  }
  function isChosen(id) {
    return S.chips.some(function (c) { return c.id === id; });
  }
  function matches() {
    var q = S.draft.trim().toLowerCase();
    if (!q) return [];
    return DIRECTORY.filter(function (p) {
      return p.name.toLowerCase().indexOf(q) !== -1 || p.email.toLowerCase().indexOf(q) !== -1;
    }).filter(function (p) { return !isChosen(p.id); });
  }
  function looksExternal() {
    var q = S.draft.trim().toLowerCase();
    return q.indexOf('@') !== -1 && q.indexOf('@' + ORG_DOMAIN) === -1;
  }
  function accessLabel() { return S.access === 'restricted' ? 'Restricted' : ORG; }
  function accessDesc() {
    if (S.access === 'restricted') {
      return 'Only the owner and people with access can open the schedule.';
    }
    return 'Anyone in this organisation can ' + (S.orgRole === 'editor' ? 'edit' : 'view') +
      ' the schedule, unless assigned another role.';
  }
  function orgRoleLabel() { return S.orgRole === 'editor' ? 'Editor' : 'Viewer'; }

  function personById(id) {
    return S.people.filter(function (p) { return p.id === id; })[0] || null;
  }
  function ownerPerson() {
    return S.people.filter(function (p) { return p.role === 'owner'; })[0] || null;
  }
  // "Make owner" is owner-only: you cannot give away what you do not hold.
  function iAmOwner() {
    var me = personById(S.me);
    return !!me && me.role === 'owner';
  }
  function firstName(name) { return String(name).trim().split(/\s+/)[0]; }

  // ---------------------------------------------------------------
  // Render &mdash; the app is rebuilt from state on every change.
  // ---------------------------------------------------------------
  function renderDashboard() {
    var bars = [
      { label: 'Store 1', h: 58 },
      { label: 'Store 2', h: 71 },
      { label: 'Store 3', h: 44 },
      { label: 'Store 4', h: 96, lead: true },
      { label: 'Store 5', h: 63 },
      { label: 'Store 6', h: 39 }
    ];
    return '' +
      '<div class="dash-top">' +
        '<span class="dash-wordmark">aiRA</span>' +
        '<span class="dash-crumb">Loyalty+ &middot; Dashboards</span>' +
      '</div>' +
      '<div class="dash-body">' +
        '<div class="dash-titlerow">' +
          '<div>' +
            '<h1 class="dash-title">' + esc(NAME) + '</h1>' +
            '<div class="dash-sub">Built by aiRA &middot; last run 6 Sep, 09:12</div>' +
          '</div>' +
          '<div class="dash-actions">' +
            '<button class="btn btn-secondary" type="button">Export</button>' +
            '<button class="btn btn-primary" type="button" data-act="open" data-live="Share">Share</button>' +
          '</div>' +
        '</div>' +
        '<div class="dash-grid">' +
          '<div class="dash-card"><div class="dash-metric-label">Net sales</div><div class="dash-metric-value">18.4L</div></div>' +
          '<div class="dash-card"><div class="dash-metric-label">Transactions</div><div class="dash-metric-value">7,204</div></div>' +
          '<div class="dash-card"><div class="dash-metric-label">Average bill</div><div class="dash-metric-value">2,554</div></div>' +
        '</div>' +
        '<div class="dash-card">' +
          '<h2 class="dash-chart-title">Store 4 leads sales this month</h2>' +
          '<div class="dash-chart-sub">Net sales by store, July</div>' +
          '<div class="dash-bars">' +
            bars.map(function (b) {
              return '<div class="dash-bar-col">' +
                '<div class="dash-bar' + (b.lead ? ' lead' : '') + '" style="height:' + b.h + '%"></div>' +
                '<div class="dash-bar-label">' + b.label + '</div>' +
              '</div>';
            }).join('') +
          '</div>' +
          '<div class="dash-sample">Sample data &mdash; the dashboard behind the dialog is context only.</div>' +
        '</div>' +
      '</div>';
  }

  function renderResults() {
    if (S.results === 'loading') {
      var rows = '';
      for (var i = 0; i < 4; i++) {
        rows += '<div class="skel-row"><div class="skel-avatar"></div>' +
          '<div class="skel-lines"><div class="skel-line short"></div><div class="skel-line long"></div></div></div>';
      }
      return '<div class="search-results" aria-busy="true">' + rows + '</div>';
    }
    if (S.results === 'none') {
      return '<div class="search-results">' +
        '<div class="no-results">' +
          '<p class="no-results-title">No matches for &ldquo;' + esc(S.draft.trim()) + '&rdquo;</p>' +
          '<p class="no-results-desc">Check the spelling, or search by full email address.</p>' +
        '</div></div>';
    }
    if (S.results === 'invalid') {
      return '<div class="validation">' +
        '<span class="banner-icon">' + ICON.error + '</span>' +
        '<span class="banner-text">' +
          '<span class="banner-title">Can&#39;t share outside ' + ORG + '</span>' +
          '<span class="banner-desc">' + esc(S.draft.trim()) + ' isn&#39;t in this organization. Share with anyone in ' +
            ORG + ', or ask your admin to add them.</span>' +
        '</span></div>';
    }
    if (S.results !== 'list') return '';

    var found = matches();
    if (!found.length) return '';
    return '<div class="search-results" role="listbox">' + found.map(function (p) {
      var taken = hasAccess(p.id);
      return '<button class="search-result-row' + (taken ? ' taken' : '') + '" role="option" type="button"' +
        (taken ? ' aria-disabled="true"' : ' data-act="pick" data-id="' + p.id + '" data-live="Pick ' + esc(p.name) + '"') + '>' +
        '<div class="avatar">' + initials(p.name) + '</div>' +
        '<div class="person-info"><div class="person-name">' + esc(p.name) + '</div>' +
        '<div class="person-email">' + esc(p.email) + '</div></div>' +
        (taken ? '<span class="has-access-flag">' + ICON.check + '<span>Has access</span></span>' : '') +
      '</button>';
    }).join('') + '</div>';
  }

  function renderInputArea() {

    if (S.chips.length) {
      return '<div class="chip-field">' + S.chips.map(function (c) {
        return '<span class="chip">' +
          '<span>' + esc(c.name) + '</span>' +
          '<button class="chip-x" type="button" aria-label="Remove ' + esc(c.name) + '" ' +
            'data-act="unchip" data-id="' + c.id + '" data-live="Remove ' + esc(c.name) + '">' + ICON.smallX + '</button>' +
        '</span>';
      }).join('') +
      '<input class="chip-input" id="addField" type="text" autocomplete="off" ' +
        'placeholder="Add another person" value="' + esc(S.draft) + '" ' +
        'data-live="Add another person">' +
      renderResults() + '</div>';
    }

    return '<div class="search-field">' +
      '<span class="search-icon">' + ICON.search + '</span>' +
      '<input class="search-input" id="addField" type="text" autocomplete="off" ' +
        'placeholder="Add people by name or email" value="' + esc(S.draft) + '" ' +
        'data-live="Add people">' +
      renderResults() +
    '</div>' + renderSuggestions();
  }

  function renderSuggestions() {
    if (!S.suggestions.length) return '';
    // Capped at three &mdash; beyond that they compete with the list below.
    return '<div class="suggest-row">' + S.suggestions.slice(0, 3).map(function (id) {
      var p = DIRECTORY.filter(function (d) { return d.id === id; })[0];
      if (!p || hasAccess(p.id) || isChosen(p.id)) return '';
      return '<button class="suggest-chip" type="button" data-act="pick" data-id="' + p.id + '" ' +
        'data-live="Add ' + esc(p.name) + '"><span class="plus">' + ICON.plus + '</span>' +
        '<span>' + esc(p.name) + '</span></button>';
    }).join('') + '</div>';
  }

  function roleMenu(p, rolesOnly) {
    if (S.roleMenuFor !== p.id) return '';
    var isEditor = p.role === 'editor';
    return '<div class="dd-menu anchored" role="listbox" data-anchor="' + p.id + '">' +
      '<button class="dd-option" role="option" type="button" data-act="role" data-id="' + p.id + '" ' +
        'data-role="editor" data-live="Set Editor">' +
        '<span class="check">' + (isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Editor</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.editor + '</span></span></button>' +
      '<button class="dd-option" role="option" type="button" data-act="role" data-id="' + p.id + '" ' +
        'data-role="viewer" data-live="Set Viewer">' +
        '<span class="check">' + (!isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Viewer</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.viewer + '</span></span></button>' +
      (rolesOnly ? '' :
      '<div class="dd-divider"></div>' +
      (iAmOwner()
        ? '<button class="dd-option" role="option" type="button" data-act="askowner" data-id="' + p.id + '" ' +
            'data-live="Make ' + esc(p.name) + ' owner"><span class="check"></span>' +
            '<span class="dd-option-text"><span class="dd-option-label">Make owner</span></span></button>'
        : '') +
      '<button class="dd-option" role="option" type="button" data-act="revoke" data-id="' + p.id + '" ' +
        'data-live="Remove access"><span class="check"></span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Remove access</span></span></button>') +
    '</div>';
  }

  function orgRoleMenu() {
    var isEditor = S.orgRole === 'editor';
    return '<div class="dd-menu" role="listbox">' +
      '<button class="dd-option" role="option" type="button" data-act="orgrole" data-role="editor" ' +
        'data-live="Everyone can edit">' +
        '<span class="check">' + (isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Editor</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.editor + '</span></span></button>' +
      '<button class="dd-option" role="option" type="button" data-act="orgrole" data-role="viewer" ' +
        'data-live="Everyone can view">' +
        '<span class="check">' + (!isEditor ? ICON.check : '') + '</span>' +
        '<span class="dd-option-text"><span class="dd-option-label">Viewer</span>' +
        '<span class="dd-option-sub">' + ROLE_SUB.viewer + '</span></span></button>' +
    '</div>';
  }

  function renderPeople() {
    if (S.peopleError) {
      return '<div class="list-error">' +
        '<span class="list-error-icon">' + ICON.error + '</span>' +
        '<span class="list-error-title">Couldn&#39;t load people</span>' +
        '<span class="list-error-desc">Retry, or contact support.</span>' +
        '<button class="btn btn-secondary" type="button" data-act="reload" data-live="Retry loading people">Retry</button>' +
      '</div>';
    }

    var many = S.people.length >= 6;
    var head = many
      ? '<div class="section-head"><p class="section-label">People with access</p>' +
        '<span class="count-tag">' + S.people.length + ' people</span></div>'
      : '<p class="section-label">People with access</p>';

    var rows = S.people.map(function (p) {
      // "(You)" marks the current user inline after the name, in the same text
      // style — never as a separate trailing label.
      var youMark = p.id === S.me ? ' (You)' : '';
      var trailing;
      if (p.role === 'owner') {
        trailing = '<span class="owner-label">Owner</span>';
      } else {
        trailing = '<div class="dd">' +
          '<button class="dd-trigger' + (S.roleMenuFor === p.id ? ' open' : '') + '" type="button" ' +
            'aria-haspopup="listbox" aria-expanded="' + (S.roleMenuFor === p.id) + '" ' +
            'data-act="rolemenu" data-id="' + p.id + '" data-live="Role for ' + esc(p.name) + '">' +
            '<span>' + (p.role === 'editor' ? 'Editor' : 'Viewer') + '</span>' +
            '<span class="chev">' + (S.roleMenuFor === p.id ? ICON.chevUp : ICON.chev) + '</span></button>' +
          roleMenu(p) + '</div>';
      }
      return '<div class="person-row">' +
        '<div class="avatar">' + initials(p.name) + '</div>' +
        '<div class="person-info"><div class="person-name">' + esc(p.name) + youMark + '</div>' +
        '<div class="person-email">' + esc(p.email) + '</div></div>' +
        trailing + '</div>';
    }).join('');

    return head + '<div class="people-list' + (many ? ' scrolls' : '') + '" id="peopleList">' + rows + '</div>';
  }

  function renderAccess() {
    var icon = S.access === 'restricted' ? ICON.lock : ICON.org;
    var control = '<button class="general-trigger' + (S.accessMenuOpen ? ' open' : '') + '" type="button" ' +
          'aria-haspopup="listbox" aria-expanded="' + S.accessMenuOpen + '" ' +

  // A recipient is anyone who'd receive mail: everyone shared with, plus a new
  // The email view is its own thing, independent of the dashboard scenario:
  // pick which email to preview. Each type builds a sample recipient.

    { id: 'viewer',   name: 'Shared — viewer',  role: 'viewer' },
    { id: 'editor',   name: 'Shared — editor',  role: 'editor' },
    { id: 'transfer', name: 'Ownership transfer',    role: 'owner', gotOwner: 'transfer' },
    { id: 'admin',    name: 'Admin reassigned',      role: 'owner', gotOwner: 'admin' }
  ];
  function emailSample() {
    var t = EMAIL_TYPES.filter(function (x) { return x.id === S.emailType; })[0] || EMAIL_TYPES[1];
    return { id: 'sample', name: 'Punya Shetty', email: 'punya.shetty@capillarytech.com', role: t.role, gotOwner: t.gotOwner };
  }

  function renderEmailView() {

      share: 'Ann Francis shared a dashboard with you',

      admin: 'You&rsquo;re now the owner of a dashboard'
    };

    return '<div class="email-stage">' +
      '<div class="email-client">' +

              '<div class="email-to">to ' + esc(p.name) + ' <span class="email-addr">&lt;' + esc(p.email) + '&gt;</span></div>' +

  function render() {
    if (S.mode === 'email') {
      app.innerHTML = renderEmailView() + renderToast();
      return;
    }
    app.innerHTML = S.open ? renderDialog() + renderConfirmOwner() : '';
    restoreScroll();
    positionMenus();
    restoreFocus();
  }

  function positionMenus() {
    var menu = app.querySelector('.dd-menu.anchored');
    if (!menu) return;
    var trigger = app.querySelector('[data-act="rolemenu"][data-id="' + menu.getAttribute('data-anchor') + '"]');
    if (!trigger) return;
    var t = trigger.getBoundingClientRect();
    var h = menu.offsetHeight;
    var below = t.bottom + 4;
    // Flip above the trigger when the menu would run past the viewport.
    var top = (below + h > window.innerHeight - 8) ? Math.max(8, t.top - h - 4) : below;
    menu.style.top = top + 'px';
    menu.style.left = Math.max(8, t.right - menu.offsetWidth) + 'px';
  }

  function restoreScroll() {
    var list = document.getElementById('peopleList');
    if (!list) return;
    S.listScrollTop = Math.max(0, Math.min(S.listScrollTop, list.scrollHeight - list.clientHeight));
    list.scrollTop = S.listScrollTop;
    list.onscroll = function () {
      S.listScrollTop = list.scrollTop;
      positionMenus();
    };
  }

  function restoreFocus() {
    if (!S.inputFocused) return;
    var f = document.getElementById('addField');
    if (!f) { S.inputFocused = false; return; }
    f.focus();
    var pos = Math.min(S.caret, f.value.length);
    try { f.setSelectionRange(pos, pos); } catch (e) { /* not supported on this input type */ }
  }

  // ---------------------------------------------------------------
  // Interactions. Every one ends in a single render, via act().
  // ---------------------------------------------------------------
  // An actionable toast dwells longer than a plain confirmation: 4s is tight
  // when the undo is the only way back from a destructive action.
  function showToast(text, withUndo) {
    if (timers.toast) clearTimeout(timers.toast);
    S.toast = { text: text, undo: !!withUndo };
    timers.toast = setTimeout(function () {
      timers.toast = null;
      S.toast = null;
      S.undo = null;
      render();
    }, withUndo ? 6000 : 4000);
  }

  function clearToast() {
    if (timers.toast) { clearTimeout(timers.toast); timers.toast = null; }
    S.toast = null;
  }

  function renderToast() {
    if (!S.toast) return '';
    return '<div class="toast" role="status">' +
      '<span>' + esc(S.toast.text) + '</span>' +
      (S.toast.undo
        ? '<button class="toast-undo" type="button" data-act="undo" data-live="Undo">Undo</button>'
        : '') +
    '</div>';
  }

  function openMenusClosed() {
    S.roleMenuFor = null;
    S.accessMenuOpen = false;
    S.orgRoleMenuOpen = false;
    S.batchRoleMenuOpen = false;
  }

  function anyMenuOpen() {
    return !!(S.roleMenuFor || S.accessMenuOpen || S.orgRoleMenuOpen || S.batchRoleMenuOpen);
  }

  function addChip(id) {
    var p = DIRECTORY.filter(function (d) { return d.id === id; })[0];
    if (!p || isChosen(id) || hasAccess(id)) return;
    S.chips.push({ id: p.id, name: p.name, email: p.email });
    S.draft = '';
    S.caret = 0;
    S.results = 'closed';
    // Picking someone is what opens the compose step, as in Drive.
    S.view = 'compose';
    // Keep the caret in the field: the next thing you do is usually add
    // another person, and focus must never fall back to the body.
    S.inputFocused = true;
  }

  function runShare() {
    if (!S.chips.length) return;
    S.banner = null;
    S.busy = true;
    render();
    timers.share = setTimeout(function () {
      timers.share = null;
      S.busy = false;

      if (S.failNext) {
        S.failNext = false;
        S.banner = {
          title: 'Couldn&#39;t share this schedule',
          desc: 'Retry, or contact support.'
        };
        render();
        return;
      }

      if (S.partialNext && S.chips.length) {
        S.partialNext = false;
        var failing = S.chips[S.chips.length - 1];
        var landed = S.chips.slice(0, -1);
        landed.forEach(function (c) { S.people.push(person(c.id, c.name, c.email, 'viewer')); });
        S.chips = [failing];
        S.view = 'compose';
        S.banner = {
          title: 'Shared with ' + landed.length + ' of ' + (landed.length + 1) + ' people',
          desc: esc(failing.name) + '&#39;s account is deactivated. Remove them, or ask your admin to reactivate it.'
        };
        render();
        return;
      }

      var n = S.chips.length;
      var role = S.batchRole;
      var notify = S.notify;
      var msg = S.message;
      S.chips.forEach(function (c) {
        var np = person(c.id, c.name, c.email, role);
        np.notify = notify;
        np.message = msg;
        S.people.push(np);
      });
      S.chips = [];
      S.shared = true;
      S.message = '';
      S.view = 'picker';
      // The next batch starts from the safe default again.
      S.batchRole = 'viewer';
      showToast('Shared with ' + n + (n === 1 ? ' person' : ' people'), false);
      render();
    }, 1300);
  }

  function typed(value, caret) {
    S.draft = value;
    S.caret = caret;
    S.inputFocused = true;
    if (timers.load) { clearTimeout(timers.load); timers.load = null; }

    if (!S.draft.trim()) {
      S.results = 'closed';
      render();
      return;
    }
    if (looksExternal()) {
      S.results = 'invalid';
      render();
      return;
    }
    S.results = 'loading';
    render();
    timers.load = setTimeout(function () {
      timers.load = null;
      var found = matches();
      S.results = found.length ? 'list' : 'none';
      if (!found.length) {
        render();
      } else {
        render();
      }
    }, 420);
  }

  var MENU_TOGGLES = { rolemenu: 1, accessmenu: 1, orgrolemenu: 1, batchrolemenu: 1 };

  function act(el) {
    var a = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    if (!MENU_TOGGLES[a]) openMenusClosed();

    if (a === 'open') { S.open = true; render(); return; }
    if (a === 'close') { S.open = false; openMenusClosed(); render(); if (ONCLOSE) ONCLOSE({ people: S.people, access: S.access, orgRole: S.orgRole }); return; }

    if (a === 'pick') { addChip(id); render(); return; }
    if (a === 'unchip') {
      S.chips = S.chips.filter(function (c) { return c.id !== id; });
      if (!S.chips.length) { S.view = 'picker'; S.banner = null; }
      render();
      return;
    }
    if (a === 'share' || a === 'send') { runShare(); return; }
    if (a === 'settings') {
      // Remember where we came from so Back returns there &mdash; the compose
      // batch (chips, note) stays intact while you dip into settings.
      S.settingsFrom = S.view;
      S.view = 'settings';
      S.roleMenuFor = null;
      S.batchRoleMenuOpen = false;
      render();
      return;
    }
    if (a === 'back' && S.view === 'settings') {
      // The toggle applies as it is ticked, so this is just the way back.
      S.view = S.settingsFrom || 'picker';
      render();
      return;
    }
    if (a === 'back' || a === 'cancel') {
      // Both drop the pending recipients, as in Drive: a pending batch only
      // exists inside compose.
      S.chips = [];
      S.draft = '';
      S.results = 'closed';
      S.banner = null;
      S.message = '';
      S.batchRoleMenuOpen = false;
      S.batchRole = 'viewer';
      S.view = 'picker';
      render();
      return;
    }
    if (a === 'batchrolemenu') {
      S.batchRoleMenuOpen = !S.batchRoleMenuOpen;
      render();
      return;
    }
    if (a === 'batchrole') {
      S.batchRole = el.getAttribute('data-role');
      S.batchRoleMenuOpen = false;
      render();
      return;
    }

    if (a === 'rolemenu') {
      S.roleMenuFor = S.roleMenuFor === id ? null : id;
      S.accessMenuOpen = false;
      render();
      return;
    }
    if (a === 'role') {
      var role = el.getAttribute('data-role');
      S.people.forEach(function (p) { if (p.id === id) p.role = role; });
      S.roleMenuFor = null;
      render();
      return;
    }
    if (a === 'askowner') {
      S.confirmOwner = id;
      render();
      return;
    }
    if (a === 'cancelowner') {
      S.confirmOwner = null;
      render();
      return;
    }
    if (a === 'confirmowner') {
      var target = personById(id);
      var cur = ownerPerson();
      // Single owner: the seat moves. The old owner steps down to editor.
      if (cur && cur.id !== id) { cur.role = 'editor'; cur.caps = allCaps(); cur.gotOwner = null; }
      if (target) { target.role = 'owner'; target.caps = allCaps(); target.gotOwner = 'transfer'; }
      S.confirmOwner = null;
      if (target) showToast(target.name + ' is now the owner', false);
      render();
      return;
    }
    if (a === 'noop') { return; }

    if (a === 'revoke') {
      var idx = -1, removed = null;
      S.people.forEach(function (p, i) { if (p.id === id) { idx = i; removed = p; } });
      if (!removed) return;
      S.people.splice(idx, 1);
      S.roleMenuFor = null;
      S.undo = { person: removed, index: idx };
      showToast('Removed ' + removed.name, true);
      render();
      return;
    }
    if (a === 'undo') {
      if (S.undo) {
        S.people.splice(S.undo.index, 0, S.undo.person);
        S.undo = null;
      }
      clearToast();
      render();
      return;
    }

    if (a === 'accessmenu') {
      S.accessMenuOpen = !S.accessMenuOpen;
      S.roleMenuFor = null;
      S.orgRoleMenuOpen = false;
      render();
      return;
    }
    if (a === 'orgrolemenu') {
      S.orgRoleMenuOpen = !S.orgRoleMenuOpen;
      S.roleMenuFor = null;
      S.accessMenuOpen = false;
      render();
      return;
    }
    if (a === 'orgrole') {
      S.orgRole = el.getAttribute('data-role');
      S.orgRoleMenuOpen = false;
      render();
      return;
    }
    if (a === 'access') {
      S.access = el.getAttribute('data-value');
      S.accessMenuOpen = false;
      render();
      return;
    }

    if (a === 'copy') {
      S.copied = true;
      if (timers.copy) clearTimeout(timers.copy);
      timers.copy = setTimeout(function () { timers.copy = null; S.copied = false; render(); }, 1600);
      render();
      return;
    }

    if (a === 'reload') { S.peopleError = false; S.people = baseline(); render(); return; }
  }

  app.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (el) {
      if (el.tagName === 'A') e.preventDefault();
      act(el);
      return;
    }
    var field = e.target.closest('.chip-field, .search-field');
    if (field) {
      var input = field.querySelector('#addField');
      if (input) { S.inputFocused = true; input.focus(); return; }
    }
    // Clicking outside an open menu closes it, as the real dropdown does.
    if (anyMenuOpen() && !e.target.closest('.dd-menu, .general-menu')) {
      openMenusClosed();
      render();
    }
  });
  app.addEventListener('input', function (e) {
    if (e.target.id === 'message') { S.message = e.target.value; return; }
    if (e.target.id !== 'addField') return;
    typed(e.target.value, e.target.selectionStart || e.target.value.length);
  });
  app.addEventListener('change', function (e) {
    if (e.target.id === 'notify') { S.notify = e.target.checked; render(); return; }
    if (e.target.id === 'editorShare') { S.canEditorsShare = e.target.checked; render(); return; }
  });
  app.addEventListener('focusin', function (e) {
    if (e.target.id === 'addField') S.inputFocused = true;
  });

  // ---------------------------------------------------------------
  // Steps. Each apply() fully specifies the state.
  // ---------------------------------------------------------------
  function reset() {
    clearTimers();
    S.open = true;
    S.view = 'picker';
    S.people = baseline();
    S.batchRole = 'viewer';
    S.batchRoleMenuOpen = false;
    S.canEditorsShare = true;
    S.notify = true;
    S.message = '';
    S.peopleError = false;
    S.draft = '';
    S.caret = 0;
    S.inputFocused = false;
    S.results = 'closed';
    S.suggestions = [];
    S.chips = [];
    S.roleMenuFor = null;
    S.accessMenuOpen = false;
    S.access = 'restricted';
    S.orgRole = 'viewer';
    S.orgRoleMenuOpen = false;
    S.busy = false;
    S.banner = null;
    S.toast = null;
    S.copied = false;
    S.undo = null;
    S.shared = false;
    S.listScrollTop = 0;
    S.me = 'owner';
    // Failure arming now belongs to the scenario, so each scenario fully
    // specifies it: clear here, the failure scenarios set it after.
    S.failNext = false;
    S.partialNext = false;
  }

  // ---------------------------------------------------------------
  // Scenarios. Only the states you cannot reach by clicking the
  // product: a different role, a dataset size, a failure to arm.
  // Everything else is reached the way a real user would reach it.
  // ---------------------------------------------------------------

  return {
    isOpen: function () { return S.open; },
    close: function () { act({ getAttribute: function (k) { return k === 'data-act' ? 'close' : null; }, tagName: 'BUTTON' }); },
    open: function (o) {
      NAME = o.name; OWNER = o.owner; ONCLOSE = o.onClose;
      reset();
      if (o.saved) { S.people = JSON.parse(JSON.stringify(o.saved.people)); S.access = o.saved.access; S.orgRole = o.saved.orgRole; }
      else if (o.extra) o.extra.forEach(function (p) { S.people.push(person(p.id, p.name, p.email, p.role)); });
      S.me = o.me || 'owner';
      if (!o.saved && o.access) S.access = o.access;
      render();
    }
  };
}
</script>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════════════
   aiRA Settings → Schedules. Built on the same chassis as Context and Whitelist

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')

const I = {

                      + 'a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>', s),
  history:      s => ic('<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>'
                      + '<path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>', s),
  play:         s => ic('<polygon points="6 3 20 12 6 21 6 3"/>', s),
  eye:          s => ic('<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>', s),

  send:         s => ic('<path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/>', s),

  messageSquare: s => ic('<path d="M22 17a2 2 0 0 1-2 2H6l-4 4V5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2z"/>', s),
  loader:       s => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none"`
                      + ` stroke="currentColor" stroke-width="1.5" stroke-linecap="round"`
                      + ` class="spin" aria-hidden="true" style="flex:none">`
                      + `<path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`,
};
const sparkle = (s=24) =>
  `<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true" style="flex:none"><defs>`
  + `<linearGradient id="g${s}" x1="0" y1="0" x2="1" y2="1">`
  + `<stop offset="0" stop-color="var(--aira-brand-from)"/>`
  + `<stop offset="1" stop-color="var(--aira-brand-to)"/></linearGradient></defs>`

  + `<path d="M19 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" fill="url(#g${s})"/></svg>`;
const live  = k => ` data-fk="${esc(k)}"`;
const named = (label, k) => ` data-fk="${esc(k)}" aria-label="${esc(label)}"`;

const avatar = init =>

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  return `${h}:${String(d.getMinutes()).padStart(2,'0')} ${ap}`; };
const fRun = d => `${DOW[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}`;

let RSEQ = 0;
const mkRun = (at, to, o={}) => Object.assign({

  const daily = [];

  const fRec = ['campaign.team','store.ops','marketing.head','regional.south','regional.west'].map(tr);
  const fest = [];
  for (let i = 0; i < 16; i++) fest.push(mkRun(addDays(D(10,5,19,0), -i), fRec));

  const pts = [D(8,24,11,0), D(8,17,11,0), D(8,10,11,0)].map(d => mkRun(d, xRec));

  /* cfg is the scheduler panel's own state shape, so the drawer can mount the

      subject:'Last week’s sales: revenue, orders and best channels',
      cfg:{ repeats:'weekly', weekDays:[0], time:'09:00', cron:'0 9 * * 1' },
      status:'live', next:D(10,19,9,0), owner:ME, to:wRec, bad:[], runs:weekly },
    { id:'s3', ver:3, name:'Monthly Loyalty Summary', sched:'Every month on the 1st at 10:00 AM',
      subject:'Loyalty last month: members, points and redemptions',
      cfg:{ repeats:'monthly', monthDays:[1], time:'10:00', cron:'0 10 1 * *' },
      status:'live', next:D(11,1,10,0), owner:cap('rahul.kamath'), sharedMe:'viewer', to:mRec, bad:[], runs:monthly },
    { id:'s4', ver:1, name:'Store Ops Weekly', sched:'Every Fri at 6:00 PM',
      subject:'This week in stores: footfall, sales and stock gaps',
      cfg:{ repeats:'weekly', weekDays:[4], time:'18:00', cron:'0 18 * * 5' },
      status:'live', next:D(10,16,18,0), owner:ME,
      to:STORE_OPS.slice(0, 8), bad:[], runs:[] },
    { id:'s5', ver:2, name:'Tier Upgrade Watch', sched:'Every weekday (Mon–Fri) at 8:00 AM',
      subject:'Members close to their next tier',
      cfg:{ repeats:'weekly', weekDays:[0,1,2,3,4], time:'08:00', cron:'0 8 * * 1-5' },
      status:'paused', next:null, resume:D(10,15,8,0), owner:cap('harsh.devda'), sharedMe:'editor', to:tRec, bad:[], runs:tier },
    { id:'s6', ver:1, name:'Festive Campaign Tracker', sched:'Every day at 7:00 PM, Sep 20 to Oct 5',
      subject:'Festive campaign: yesterday’s redemptions and revenue',
      cfg:{ repeats:'daily', time:'19:00', cron:'0 19 * * *', endMode:'date', end:'2026-10-05' },
      status:'ended', next:null, ended:D(10,5,19,0), owner:cap('prarthana.dwivedi'), to:fRec, bad:[], runs:fest },
    { id:'s7', ver:1, name:'Points Expiry Alert', sched:'Every Mon at 11:00 AM',
      subject:'Points expiring in the next 30 days',
      cfg:{ repeats:'weekly', weekDays:[0], time:'11:00', cron:'0 11 * * 1' },
      status:'archived', next:null, owner:cap('chinmay'), to:xRec, bad:[], runs:pts },
  ];
}
let SCH = seed();
const SX = id => SCH.find(s => s.id === id);

/* ── state ────────────────────────────────────────────────────────────────── */
const S = { status:'all', owner:'any', q:'', sort:'asc', menu:null, drawer:null,
  open:{}, tech:{}, allRec:{}, shown:10, modal:null, toast:null, focus:null };

/* ── status pill (a schedule's state) and result mark (a run's outcome) ───────
   AiraPill, as published: a filled surface with its paired text token, no border,
   no dot, 2px 10px, Label sm. Live is green (the user's call), Paused takes the
   awaiting pair (on hold), Ended / Archived / Draft the neutral draft pair. A run's outcome is a different thing, so it is an icon and a word. */
const STATE = {
  live:     { label:'Live',     bg:'#E7F6EC', fg:'#185C32', dot:'#2A9D55' },  /* green-50 / 600 / 400 */
  paused:   { label:'Paused',   bg:'#FFF6E0', fg:'#8A5500', dot:'#E89B1A' },  /* amber-50 / 500 / 300 */
  ended:    { label:'Ended',    bg:'#EEF1F4', fg:'#364152', dot:'#9AA4B2' },  /* slate-100 / 700 / 400 */
  archived: { label:'Archived', bg:'#EEF1F4', fg:'#364152', dot:'#9AA4B2' },
  draft:    { label:'Draft',    bg:'#EEF1F4', fg:'#364152', dot:'#9AA4B2' },
};
/* The published status pill with its leading dot: 2px 8px, 4px gap, 6px dot. */
const chip = st => `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 8px;`

const INSET = 32, CELL = 16;
const COLS = {
  name:  'flex:1 1 0;min-width:240px',
  state: 'width:84px;flex:none',
  next:  'width:120px;flex:none',
  last:  'width:128px;flex:none',
  owner: 'flex:0 1 260px;min-width:160px',
  act:   'width:56px;flex:none',
};
const gutter = '<span style="width:32px;flex:none"></span>';

const STATUSES = [['all','All'], ['live','Live'], ['paused','Paused'], ['ended','Ended'], ['archived','Archived']];
const OWNERS = [['any','Any owner'], ['me','Owned by me'], ['shared','Shared with me']];
/* Shared with me: someone else owns it and has added me by name. Schedules I can
   see only through org-wide access are not "shared with me". */
const sharedWithMe = s => s.owner !== ME
  && (s.share ? s.share.people.some(p => p.email === ME) : !!s.sharedMe);
const labelOf = (opts, v) => (opts.find(o => o[0] === v) || opts[0])[1];

function visibleRows() {
  const q = S.q.trim().toLowerCase();
  const rank = s => s.status === 'archived' ? 3 : s.next ? 0 : s.status === 'paused' ? 1 : 2;
  return SCH.filter(s => (S.status === 'all' || s.status === S.status)
      && (S.owner === 'any' || (S.owner === 'me' ? s.owner === ME : sharedWithMe(s)))
      && (!q || s.name.toLowerCase().includes(q) || s.owner.includes(q)))
    .sort((a, b) => rank(a) - rank(b)
      || (a.next && b.next ? (S.sort === 'asc' ? a.next - b.next : b.next - a.next) : 0));
}

function dropdown(opts, key, sel) {

    + `<button class="reset hov" aria-haspopup="listbox" aria-expanded="${open}" `

    + (open ? `<div class="menu" role="listbox" style="${col(0,'position:absolute;left:0;top:calc(100% + 4px);'

/* One way in (Open, the same as clicking the row), then actions. Grouped:
   open · run and stop · access · put away. Run history is a tab inside the
   drawer, so it is not a second menu item. */
function menuGroups(s) {
  const view = [['Open', I.eye, 'edit']]; // eye, to match the Context and Whitelist URLs menus
  if (s.status === 'archived') return [view, [['Restore', I.archiveRestore, 'restore']]];
  const g = [view];
  if (s.status === 'live')   g.push([['Run now', I.send, 'runnow'], ['Pause schedule', I.pause, 'pause']]);
  if (s.status === 'paused') g.push([['Run now', I.send, 'runnow'], ['Resume schedule', I.play, 'resume']]);
  g.push([['Share', I.share, 'share']]);
  g.push([['Archive', I.archive, 'archive']]);
  return g;
}
function rowMenu(s, i, total) {
  if (S.menu !== s.id) return '';
  const up = total > 4 && i >= total - 3;
  return `<div class="menu" role="menu" style="${col(0,'position:absolute;right:0;'
      + (up ? 'bottom:calc(100% + 4px);' : 'top:calc(100% + 4px);')
      + 'min-width:168px;width:max-content;background:var(--aira-bg-elevated);'
      + 'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);'
      + 'box-shadow:var(--aira-shadow-lg);padding:8px;z-index:4')}">`
    + menuGroups(s).map(grp => grp.map(([t, g, a]) =>
        `<button class="reset mitem" role="menuitem" style="${row(12,'padding:8px 12px;'
        + 'border-radius:var(--aira-radius-xs);' + F.body + ';color:var(--aira-text-secondary)')}"`
        + live('mi:' + a + ':' + s.id) + `>${g(ICON)}${esc(t)}</button>`).join(''))
      .join(`<div role="separator" style="height:1px;background:var(--aira-border-subtle);margin:4px 0"></div>`)
    + `</div>`;
}

function listing() {
  const rows = visibleRows();
  const stack = (a, b, quiet) => `<div style="${col(0,'min-width:0')}">`

        + `<span class="quiet" style="${F.bodySm};color:var(--aira-text-tertiary);${tab};padding-left:22px">`

  const h = (t, c) => `<div style="${row(4, c + ';white-space:nowrap;color:var(--aira-text-primary);' + F.lblMd)}">${t}</div>`;
  const head = `<div style="${row(0,`padding:12px ${CELL}px;position:sticky;top:0;z-index:2;flex:none;`

    + live('sort') + `>Next run${sortMark}</button></div>`
    + gutter + h('Last run', COLS.last) + gutter + h('Owner', COLS.owner) + gutter + h('Actions', COLS.act) + `</div>`;

  const empty = `<div style="${col(8,'flex-grow:1;align-items:center;justify-content:center;padding:64px 24px;text-align:center')}">`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.search(20)}</span>`
    + `<span style="${F.h4};color:var(--aira-text-primary)">No schedules in this view</span>`

  return `<div style="${col(0,`flex-grow:1;min-height:0;padding:24px ${INSET}px 32px`)}">`

    + `<div style="${row(12,'padding:0 0 16px')}">`
    + dropdown(STATUSES, 'status', S.status) + dropdown(OWNERS, 'owner', S.owner)
    + `<label class="qwrap" style="${row(8,'flex:1;max-width:360px;height:36px;border:1px solid var(--aira-border-default);'
      + 'border-radius:var(--aira-radius-md);padding:0 12px;background:var(--aira-bg-elevated)')}">`
    + `<span style="color:var(--aira-text-tertiary);display:flex">${I.search(16)}</span>`
    + `<input class="qbox" id="qbox" type="text" value="${esc(S.q)}" placeholder="Search schedules" aria-label="Search schedules" `
    + `style="${F.body};color:var(--aira-text-primary);border:0;background:none;padding:0;flex:1;min-width:0;outline:none"></label>`
    + `<span style="flex-grow:1"></span>`
    + `<span style="${F.bodySm};color:var(--aira-text-tertiary);${tab}">${rows.length} schedule${rows.length === 1 ? '' : 's'}</span>`
    + `<span style="width:8px"></span>` + primaryBtn('New schedule', 'new', I.plus) + `</div>`
    + `<div style="${col(0,'flex-grow:1;min-height:0;border-top:1px solid var(--aira-border-default)')}">`
    + `<div class="scroller" id="stable" style="${col(0,'flex-grow:1;min-height:0;overflow-y:auto')}">`
    + head + (rows.length ? rows.map((s, i) => sRow(s, i, rows.length)).join('') : empty)
    + `</div></div></div>`;
}

/* ═══ drawer: run history and run detail in one surface ═══════════════════ */
const DRAWER_W = 760;

const measureCtx = document.createElement('canvas').getContext('2d');
function dateColW(runs) {
  measureCtx.font = '500 14px Roboto, system-ui, sans-serif';
  return Math.ceil(Math.max(0, ...runs.map(r => measureCtx.measureText(`${fRun(r.at)} · ${fTime(r.at)}`).width)));
}
function runBlock(s, r) {
  const open = !!S.open[r.id];
  const head = `<button class="reset hov" aria-expanded="${open}" style="${row(12,'padding:12px 16px;width:100%')}"`
    + live('run:' + r.id) + `>`
    + `<span style="display:flex;color:var(--aira-text-tertiary);transform:rotate(${open ? 90 : 0}deg);`
    + `transition:transform var(--aira-motion-fast) ease-out">${I.chevronRight(16)}</span>`
    /* Two parts, not three columns: the date in a column sized to the widest date
       in the list (so results line up down the list), then the result and its
       reach read as one phrase. Fixed 168 / 120px columns left 80-90px holes. */
    + `<span style="${F.lblMd};color:var(--aira-text-primary);width:${S.dateW}px;flex:none;white-space:nowrap;${tab}">${fRun(r.at)} · ${fTime(r.at)}</span>`
    + `<span style="${row(8,'flex:1;min-width:0;margin-left:12px')}">${result(r.result, F.body)}`
    + `<span aria-hidden="true" style="color:var(--aira-text-placeholder)">·</span>`
    + `<span style="${F.body};color:var(--aira-text-secondary);${tab}">${reach(r)}</span></span>`
    + (r.by ? `<span style="${F.lblSm};color:var(--aira-approval-draft-text);background:var(--aira-bg-muted);border-radius:var(--aira-radius-pill);`
        + `height:20px;padding:0 10px;display:inline-flex;align-items:center;white-space:nowrap">Run now</span>` : '')
    + `</button>`;
  if (!open) return `<div style="border-bottom:1px solid var(--aira-border-subtle)">${head}</div>`;

  let alert = '';
  if (r.result === 'partial' || r.result === 'failed') {
    const failed = r.result === 'failed';
    const n = r.notFound.length;
    const title = failed ? 'Nothing was sent'
      : `${n} email address${n === 1 ? '' : 'es'} couldn’t be found`;
    const body = failed ? r.why + ' Run it again, and contact support if it fails twice.'
      : (n === 1 ? 'Fix or remove it before the next run.' : 'Fix or remove them before the next run.');
    /* One compact line: what happened and the fix on the left, the action on the
       right. The run row above already says "Partly sent", so the box only carries
       the next step. */
    alert = `<div role="alert" style="${row(12,'padding:12px 12px 12px 16px;border-radius:var(--aira-radius-md);'
        + `background:var(--aira-status-${failed ? 'danger' : 'warning'}-bg)`)}">`
      + `<span style="display:flex;align-self:flex-start;padding-top:2px;color:var(--aira-text-${failed ? 'danger' : 'warning'})">`
      + `${(failed ? I.circleX : I.triangleAlert)(ICON)}</span>`
      + `<span style="${col(2,'flex:1;min-width:0')}"><span style="${F.lblMd};color:var(--aira-text-primary)">${title}</span>`
      + `<span style="${F.bodySm};color:var(--aira-text-secondary)">${esc(body)}</span></span>`
      + (failed ? ghostBtn('Run again', 'mi:runnow:' + s.id, I.send, true)
          : ghostBtn('Edit recipients', 'mi:editrec:' + s.id, I.squarePen, true)) + `</div>`;
  }

  /* Recipients as a two-column list: status always in the same column, so the eye
     runs straight down it. Problems first and in red; delivered rows stay quiet. */
  let rec = '';
  if (r.result !== 'failed') {
    const list = r.notFound.map(e => [e, false]).concat(r.to.filter(e => !r.notFound.includes(e)).map(e => [e, true]));
    /* Problems always show; delivered rows fill up to five, and the rest sit behind a
       Show all / Show less toggle, so a 200-person run stays readable. */
    const CUT = 5, many = list.length > CUT + 1, all = !many || !!S.allRec[r.id];
    const shown = all ? list : list.slice(0, Math.max(CUT, r.notFound.length));
    const GRID = 'display:grid;grid-template-columns:minmax(0,1fr) 128px;column-gap:16px;align-items:center;padding:0 12px';
    rec = `<div style="${col(0,'border:1px solid var(--aira-border-subtle);border-radius:var(--aira-radius-md);overflow:hidden')}">`
      + `<div style="${GRID};height:32px;background:var(--aira-bg-subtle);border-bottom:1px solid var(--aira-border-subtle);`
      + `${F.lblSm};color:var(--aira-text-tertiary)"><span>Recipient</span><span>Status</span></div>`
      + shown.map(([e, ok], i) => `<div style="${GRID};height:36px;`
        + (i < shown.length - 1 || many ? 'border-bottom:1px solid var(--aira-border-subtle);' : '') + `">`
        + `<span style="${F.bodySm};color:var(--aira-text-primary);${ellip}" title="${esc(e)}">${esc(e)}</span>`
        + (r.result === 'sending'
          ? `<span style="${F.bodySm};color:var(--aira-text-tertiary)">Waiting</span>`
          : `<span style="${row(6, F.bodySm + `;color:var(--aira-text-${ok ? 'secondary' : 'danger'})`)}">`
            + `<span style="display:flex;color:var(--aira-text-${ok ? 'success' : 'danger'})">${(ok ? I.check : I.circleX)(14)}</span>`
            + `${ok ? 'Sent' : 'Not found'}</span>`)
        + `</div>`).join('')
      + (many ? `<div style="${row(0,'height:36px;padding:0 12px')}">${linkBtn(all ? 'Show less' : `Show all ${list.length} recipients`, 'allrec:' + r.id)}</div>` : '')
      + `</div>`;
  }

  /* Technical details follow the recipients table exactly: a label/value list for
     the run's facts, then the same bordered table (heading band, row rules, status
     with an icon) for the scripts, so every column has a heading and lines up. */
  const failedRun = r.result === 'failed';
  const factRow = (k, v) => `<div style="display:grid;grid-template-columns:96px minmax(0,1fr);column-gap:16px;padding:2px 0">`
    + `<span style="${F.bodySm};color:var(--aira-text-tertiary)">${k}</span>`
    + `<span style="${F.bodySm};color:var(--aira-text-primary);${tab}">${v}</span></div>`;
  const SG = 'display:grid;grid-template-columns:120px 72px 112px minmax(0,1fr);column-gap:16px;align-items:center;padding:0 12px';
  const tech = S.tech[r.id]
    ? `<div style="${col(12)}">`
      + `<div style="${col(0)}">`
      + factRow('Started', `${fDate(r.at)}, ${fTime(r.at).replace(' ', ':' + String(r.dur % 60).padStart(2, '0') + ' ')} IST`)
      + factRow('Duration', `${(r.dur / 1000).toFixed(1)}s`)
      + (r.by ? factRow('Started by', esc(r.by)) : '') + `</div>`
      + `<div style="${col(0,'border:1px solid var(--aira-border-subtle);border-radius:var(--aira-radius-md);overflow:hidden')}">`
      + `<div style="${SG};height:32px;background:var(--aira-bg-subtle);border-bottom:1px solid var(--aira-border-subtle);`
      + `${F.lblSm};color:var(--aira-text-tertiary)"><span>Script</span><span>Time</span><span>Status</span><span>Outputs</span></div>`
      + SCRIPTS.map(([n, out], i) => {
          const st = failedRun ? (i === 0 ? ['Timed out', false] : ['Skipped', null]) : ['Done', true];
          return `<div style="${SG};min-height:36px;padding-block:8px;${i < SCRIPTS.length - 1 ? 'border-bottom:1px solid var(--aira-border-subtle);' : ''}">`
            + `<span style="${F.bodySm};color:var(--aira-text-primary);${ellip}">${n}</span>`
            + `<span style="${F.bodySm};color:var(--aira-text-secondary);${tab}">${failedRun && i ? '—' : Math.round(r.dur / (i ? 7 : 4)) + 'ms'}</span>`
            + `<span style="${row(6, F.bodySm + `;color:var(--aira-text-${st[1] === false ? 'danger' : 'secondary'})`)}">`
            + (st[1] === null ? '' : `<span style="display:flex;color:var(--aira-text-${st[1] ? 'success' : 'danger'})">${(st[1] ? I.check : I.circleX)(14)}</span>`)
            + `${st[0]}</span>`
            + `<span style="${F.bodySm};color:var(--aira-text-secondary);overflow-wrap:anywhere">${failedRun ? '—' : out}</span></div>`;
        }).join('')
      + `</div></div>`
    : '';

  return `<div style="border-bottom:1px solid var(--aira-border-subtle)">${head}`
    + `<div style="${col(16,'padding:4px 16px 16px 44px')}">`
    + alert + rec
    + (r.result === 'sending' ? '' : `<div style="${col(8)}">`
      + linkBtn(S.tech[r.id] ? 'Hide technical details' : 'View technical details', 'tech:' + r.id) + tech + `</div>`)
    + `</div></div>`;
}

/* The drawer is one surface with two tabs. Overview is the scheduler panel's own
   Schedule / Recipients / Preview sections, mounted from the same code as chat, so
   the schedule reads and edits the same way in both places. Run history is the
   runs list. It lives in its own host outside the listing, so the listing can
   re-render without wiping an edit in progress. */
function runsPane(s) {
  const recent = s.runs.filter(r => r.at >= addDays(NOW, -30) && r.result !== 'sending');
  const cnt = k => recent.filter(r => r.result === k).length;
  const parts = [['sent','sent'], ['partial','partly sent'], ['failed','failed']]
    .filter(([k]) => cnt(k)).map(([k, w]) => `${cnt(k)} ${w}`);
  const summary = recent.length ? `Last 30 days: ${parts.join(', ')}` : 'No runs in the last 30 days';
  if (!s.runs.length) {
    const first = s.next ? `First run: ${fRun(s.next)} at ${fTime(s.next)} IST` : 'It hasn’t run yet.';
    return `<div style="${col(8,'align-items:center;text-align:center;margin:24px;padding:48px 24px;'
        + 'border:1px dashed var(--aira-border-default);border-radius:var(--aira-radius-md)')}">`
      + `<span style="color:var(--aira-text-tertiary);display:flex">${I.history(20)}</span>`
      + `<span style="${F.h4};color:var(--aira-text-primary)">No runs yet</span>`
      + `<span style="${F.bodySm};color:var(--aira-text-secondary)">${first}</span></div>`;
  }
  return `<div style="${col(12,'padding:20px 24px 24px')}">`
    + `<span style="${F.bodySm};color:var(--aira-text-secondary)">${summary}</span>`
    + `<div style="${col(0,'border:1px solid var(--aira-border-default);border-radius:var(--aira-radius-md);overflow:hidden')}">`
    + (S.dateW = dateColW(s.runs.slice(0, S.shown)), s.runs.slice(0, S.shown).map(r => runBlock(s, r)).join('')) + `</div>`
    + (s.runs.length > S.shown ? `<div style="${row(0,'justify-content:center')}">${ghostBtn('Show older runs', 'older')}</div>` : '')
    + `</div>`;
}
